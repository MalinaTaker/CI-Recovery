name: Inspect X6532 TWRP Vendor Boot

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - name: Compare Offsets & Init Structure
        run: |
          sudo apt-get update && sudo apt-get install -y unzip curl cpio file
          mkdir -p work && cd work

          curl -Lo magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk
          unzip -q magisk.apk "lib/x86_64/libmagiskboot.so"
          mv lib/x86_64/libmagiskboot.so ./magiskboot
          chmod +x ./magiskboot
          rm -rf magisk.apk lib

          curl -L -o vendor_boot_x6532.img "https://github.com/${{ github.repository }}/releases/download/v1.0/vendor_boot_x6532.img"

          echo "=== 1. OFFSET MEMORI X6532 ==="
          python3 -c '
          import struct
          with open("vendor_boot_x6532.img", "rb") as f:
              d = f.read(2128)
          k, r, rsz = struct.unpack_from("<III", d, 16)
          t = struct.unpack_from("<I", d, 2076)[0]
          hsz, dsz, daddr = struct.unpack_from("<IIQ", d, 2096)
          print(f"kernel=0x{k:08x} ramdisk=0x{r:08x} tags=0x{t:08x} dtb=0x{daddr:08x} hdr_sz={hsz}")
          '

          echo "=== 2. UNPACK & CEK /init DI RECOVERY.CPIO ==="
          ./magiskboot unpack -h vendor_boot_x6532.img
          cpio -tv < vendor_ramdisk/recovery.cpio 2>/dev/null | grep -E " (init|system/bin/init|system/bin/recovery)$"
